<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="The river of riches runs deep and slow">
  <!-- 远山轮廓：起伏的山脊线，最淡的层次 -->
  <path d="M 0 62 L 22 28 L 48 52 L 72 20 L 98 48 L 128 14 L 158 40 L 188 24 L 218 50 L 240 36 L 240 72 L 0 72 Z"
        fill="#0f6e56" opacity="0.12"/>

  <!-- 泉眼 / 落日，象征财富之源 -->
  <circle cx="206" cy="26" r="5" fill="#085041" opacity="0.7"/>

  <!-- 倒影：山影在水面轻微下沉，几乎不可见 -->
  <g transform="matrix(1, 0, 0, -0.35, 0, 140)" opacity="0.06">
    <path d="M 0 62 L 22 28 L 48 52 L 72 20 L 98 48 L 128 14 L 158 40 L 188 24 L 218 50 L 240 36 L 240 72 L 0 72 Z"
          fill="#0f6e56"/>
  </g>

  <!-- 主河道：S 形蜿蜒流过画面——「runs」 -->
  <path d="M 8 82 Q 48 96, 88 90 T 168 94 T 234 86"
        stroke="#0f6e56" stroke-width="2.4" fill="none" opacity="0.9" stroke-linecap="round"/>

  <!-- 中层水波：河面反光 -->
  <path d="M 18 104 Q 58 110, 98 104 T 178 110 T 230 104"
        stroke="#0f6e56" stroke-width="1.3" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- 远岸浅波：最淡，营造「deep」的距离感 -->
  <path d="M 28 120 Q 68 126, 108 120 T 188 126 T 230 120"
        stroke="#0f6e56" stroke-width="1.4" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>